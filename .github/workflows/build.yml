name: Build FantasticMC APK
'on': workflow_dispatch

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
- uses: gradle/actions/setup-gradle@v4
- name: Check ZIP
run: test -f FantasticMC.zip
- name: Extract ZIP
run: unzip -o FantasticMC.zip -d extracted_project
- name: Locate project
run: |
find extracted_project -name settings.gradle -o -name settings.gradle.kts
