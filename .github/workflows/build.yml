name: Build FantasticMC APK

'on':
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check FantasticMC ZIP
    run: test -f FantasticMC.zip

  - name: Extract Android project
    run: unzip -o FantasticMC.zip -d extracted_project

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Build FantasticMC APK
    run: gradle -p extracted_project/FantasticMC assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FantasticMC-New-APK
      path: extracted_project/FantasticMC/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
